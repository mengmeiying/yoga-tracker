<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Йога</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%23e64980'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b1020;
    --panel: #121a2e;
    --panel-2: #1a2440;
    --line: #26304a;
    --text: #e6e9f2;
    --muted: #8b93a7;
    --weekend: #151e36;
    --home: #e64980;
    --morning: #94d82d;
    --evening: #4dabf7;
    --shoulders: #ffa94d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: 20px 16px 96px; }
  .wrap { max-width: 1200px; margin: 0 auto; }
  button { font: inherit; color: inherit; cursor: pointer; }
  h1 { font-size: 24px; margin: 0; }
  h2 { font-size: 17px; margin: 0; }
  code { font-size: .9em; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }

  /* Шапка */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .top-date { color: var(--muted); font-size: 14px; }
  .sync-status { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 8px 14px; font-size: 13px; color: var(--muted); }
  .sync-status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--tone, #8b93a7); }

  /* Карточки серий */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 20px; }
  /* Карточка — subgrid из 5 строк: шапка, прогресс, урок, кнопки, список.
     Так в одном ряду совпадают и высоты карточек, и положение кнопок. */
  .card { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 14px; padding: 16px; display: grid; grid-template-rows: subgrid; grid-row: span 5; row-gap: 14px; }
  @supports not (grid-template-rows: subgrid) {
    .card { display: flex; flex-direction: column; gap: 14px; }
    .card .actions { margin-top: auto; }
  }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card-author { color: var(--muted); font-size: 13px; }
  .progress { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--c); }
  .progress-label { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .next-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .next-title { font-size: 19px; font-weight: 650; margin-top: 2px; }
  .next-meta { font-size: 14px; color: var(--muted); }
  .next-note { font-size: 14px; margin-top: 6px; padding: 8px 10px; border-left: 3px solid var(--c); background: var(--panel-2); border-radius: 0 8px 8px 0; }
  .actions { display: flex; gap: 8px; }
  .btn { flex: 1; min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: var(--text); font-weight: 600; }
  .btn-primary { background: var(--c); border-color: var(--c); color: var(--bg); }
  .btn-accent { background: var(--evening); border-color: var(--evening); color: var(--bg); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn-small { border: 1px solid var(--line); background: none; border-radius: 8px; padding: 10px 14px; font-size: 14px; color: var(--muted); }

  details > summary { cursor: pointer; color: var(--muted); font-size: 14px; list-style: none; padding: 4px 0; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: " ▾"; }
  details[open] > summary::after { content: " ▴"; }
  .lessons { list-style: none; margin: 8px 0 0; padding: 0; max-height: 420px; overflow-y: auto; }
  .lesson { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .check { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 2px solid #3a4560; background: none; padding: 0; display: grid; place-items: center; font-weight: 700; color: var(--bg); }
  .lesson.done .check { background: var(--c); border-color: var(--c); }
  .lesson-body { flex: 1; min-width: 0; }
  .lesson-title { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lesson.is-next .lesson-title { font-weight: 700; }
  .lesson.done .lesson-title { color: var(--muted); }
  .lesson-meta { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .play { flex: none; width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); text-decoration: none; font-size: 13px; }

  /* Сетка привычек */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; overflow-x: auto; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
  .nav { display: flex; gap: 6px; }
  .nav button { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); }
  .nav button:disabled { opacity: .3; cursor: default; }

  .habit-grid { display: grid; grid-template-columns: var(--label) repeat(var(--days), minmax(0, 1fr)); }
  .habit-grid.month { --label: 110px; --row: 36px; --dot: 22px; --dot-font: 10px; }
  .habit-grid.week  { --label: 84px;  --row: 52px; --dot: 34px; --dot-font: 13px; }
  .weekend { background-color: var(--weekend); }
  .head { text-align: center; padding: 4px 0 6px; font-size: 11px; color: var(--muted); }
  .head b { display: block; font-size: 13px; font-weight: 500; color: var(--text); }
  .head.is-today b, .head.is-today span { color: #fff; font-weight: 700; }
  .row-label { display: flex; align-items: center; gap: 8px; font-size: 14px; white-space: nowrap; overflow: hidden; padding-right: 8px; }
  .swatch { flex: none; width: 8px; height: 8px; border-radius: 50%; }
  .cell { position: relative; isolation: isolate; height: var(--row); border: 0; padding: 0; background-color: transparent; display: grid; place-items: center; }
  .cell.weekend { background-color: var(--weekend); }
  .cell:disabled { cursor: default; }
  .cell:disabled .dot { opacity: .3; }
  /* Каждая ячейка рисует только свои половинки перемычки */
  .cell.join-l::before,
  .cell.join-r::after { content: ""; position: absolute; top: 50%; height: calc(var(--dot) * .5); transform: translateY(-50%); background: var(--c); }
  .cell.join-l::before { left: 0; right: 50%; }
  .cell.join-r::after  { left: 50%; right: 0; }
  .dot { position: relative; z-index: 1; width: var(--dot); height: var(--dot); border-radius: 50%; border: 1.5px solid #3a4560; display: grid; place-items: center; font-size: var(--dot-font); font-weight: 700; color: var(--bg); }
  .dot.filled { background: var(--c); border-color: var(--c); }
  .dot.today { border-color: #cfd5e3; }
  .dot.filled.today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px #cfd5e3; }
  .count { text-align: center; font-size: 12px; color: var(--muted); padding: 6px 0; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
  .stat { background: var(--panel-2); border-radius: 10px; padding: 12px 14px; }
  .stat-value { font-size: 22px; font-weight: 700; }
  .stat-label { font-size: 13px; color: var(--muted); }

  /* Тост */
  .toast { position: fixed; z-index: 100; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); background: var(--text); color: var(--bg); border-radius: 10px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.45); font-size: 15px; }
  .toast[hidden] { display: none; }
  .toast button { border: 0; background: none; color: #1864ab; font-weight: 700; padding: 6px 8px; }

  /* Окно синхронизации */
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: min(440px, calc(100% - 32px)); }
  dialog::backdrop { background: rgba(5, 8, 18, .7); }
  .dialog-text { font-size: 14px; color: var(--muted); margin: 10px 0; }
  .dialog-text a { color: var(--evening); }
  .dialog-error { font-size: 14px; color: #ff8787; margin: 8px 0 0; }
  .input { width: 100%; margin-top: 6px; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font: inherit; font-size: 16px; }
  .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; margin-top: 16px; }
  .dialog-actions .btn { flex: none; padding: 0 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Йога</h1>
      <div class="top-date" id="today"></div>
    </div>
    <button class="sync-status" id="sync-status" data-action="sync-dialog"></button>
  </header>

  <section class="cards" id="cards"></section>

  <section class="panel">
    <div class="panel-head">
      <h2 id="period-title"></h2>
      <div class="nav">
        <button data-action="prev" aria-label="Назад">‹</button>
        <button data-action="next" id="next-btn" aria-label="Вперёд">›</button>
      </div>
    </div>
    <div class="habit-grid" id="grid"></div>
    <div class="stats" id="stats"></div>
  </section>
</div>

<div class="toast" id="toast" role="status" hidden>
  <span id="toast-text"></span>
  <button id="toast-undo">Отменить</button>
</div>

<dialog id="sync-dialog"></dialog>

// Стартовое состояние: HOME Day 0 и Day 1 уже пройдены (без даты)
// used: { id серии: время последнего использования } — для порядка карточек
const DEFAULT_STATE = { updatedAt: 0, done: { 'KWBfQjuwp4E': null, '--jhKVdZOJM': null }, used: {} };
const STORAGE_KEY = 'yoga-tracker-v1';
const SYNC_KEY = 'yoga-sync-v1';
const PROMPT_KEY = 'yoga-sync-prompted';
const GIST_FILE = 'yoga-tracker.json';
const WEEKDAYS = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const isAndroid = /Android/i.test(navigator.userAgent);

SERIES.forEach(s => {
  s.lessons = s.lessons.map(([id, day, title, dur, link, note]) =>
    ({ id, day, title, dur, link: link || id, note: note || '', series: s }));
});
const SERIES_BY_ID = Object.fromEntries(SERIES.map(s => [s.id, s]));
const LESSONS = new Map(SERIES.flatMap(s => s.lessons.map(l => [l.id, l])));

// ===== Локальное хранилище =====
let state = loadState();

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved && typeof saved.done === 'object' && saved.done !== null) {
      return { updatedAt: saved.updatedAt || 0, done: saved.done, used: saved.used || {} };
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// ===== Хелперы =====
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => ymd(new Date());
const durMin = s => (s ? s.split(':').map(Number).reduce((acc, n) => acc * 60 + n, 0) / 60 : 0);
const fmtMin = s => (s ? `${Math.round(durMin(s))} мин` : '');
const fmtShort = s => new Intl.DateTimeFormat('ru', { day: 'numeric', month: 'short' }).format(parseYmd(s));
const fmtTime = d => new Intl.DateTimeFormat('ru', { hour: '2-digit', minute: '2-digit' }).format(d);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const capitalize = s => s.charAt(0).toUpperCase() + s.slice(1);
const plural = (n, forms) => {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return forms[2];
  if (b > 1 && b < 5) return forms[1];
  if (b === 1) return forms[0];
  return forms[2];
};

const lessonLabel = l => (l.day === null ? 'Бонус' : `${l.series.dayWord || 'Day'} ${l.day}`);
const isDone = id => Object.prototype.hasOwnProperty.call(state.done, id);
const mainLessons = s => s.lessons.filter(l => l.day !== null);
const nextOf = s => mainLessons(s).find(l => !isDone(l.id));
const doneOn = (s, date) => s.lessons.filter(l => state.done[l.id] === date);

function videoUrl(id) {
  const web = `https://www.youtube.com/watch?v=${id}`;
  if (!isAndroid) return web;
  // На Android открываем сразу в приложении YouTube, минуя браузер
  return `intent://www.youtube.com/watch?v=${id}#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=${encodeURIComponent(web)};end`;
}

// Атрибуты ссылки на урок: YouTube — в приложении, остальное — в новой вкладке
function linkAttrs(l) {
  const external = /^https?:/.test(l.link);
  const href = external ? l.link : videoUrl(l.link);
  return `href="${esc(href)}"${external ? ' target="_blank" rel="noopener"' : ''}`;
}

// Любое изменение: штамп времени, сохранение, перерисовка, отправка в облако
function commit() {
  state.updatedAt = Date.now();
  saveState();
  render();
  schedulePush();
}

// Меняет отметку и возвращает функцию отмены
function setDone(id, value) {
  const seriesId = LESSONS.get(id).series.id;
  const had = isDone(id);
  const prev = state.done[id];
  const prevUsed = state.used[seriesId];
  if (value === undefined) delete state.done[id];
  else { state.done[id] = value; state.used[seriesId] = Date.now(); }
  commit();
  return () => {
    if (had) state.done[id] = prev;
    else delete state.done[id];
    if (prevUsed === undefined) delete state.used[seriesId];
    else state.used[seriesId] = prevUsed;
    commit();
  };
}

// Порядок карточек: сначала серии, которыми пользовались последними.
// Считается только при открытии страницы, чтобы карточки не прыгали под пальцем.
function computeOrder() {
  const score = s => {
    if (state.used[s.id]) return state.used[s.id];
    // Для старых отметок без времени — по дате последнего урока
    const dates = s.lessons.map(l => state.done[l.id]).filter(Boolean).sort();
    return dates.length ? parseYmd(dates[dates.length - 1]).getTime() : 0;
  };
  return SERIES
    .map((s, i) => ({ s, i, score: score(s) }))
    .sort((a, b) => b.score - a.score || a.i - b.i)
    .map(x => x.s);
}

const STATUS = {

  syncing: ['Сохраняю…', '#8b93a7'],
  ok:      ['Сохранено в облаке', '#69db7c'],
  offline: ['Нет связи, повторю позже', '#ffc078'],
  auth:    ['Токен не подходит', '#ff8787'],
  missing: ['Gist не найден', '#ff8787'],
};
const statusBtn = document.getElementById('sync-status');
const dialog = document.getElementById('sync-dialog');

let sync = loadSync();
let syncStatus = sync ? 'syncing' : 'off';
let lastSyncAt = null;
let pushTimer = null;
let retryTimer = null;
let pushing = false;

function loadSync() {
  try {
    const s = JSON.parse(localStorage.getItem(SYNC_KEY));
    if (s && s.token && s.gistId) return s;
  } catch (e) {}
  return null;
}
function saveSync() {
  if (sync) localStorage.setItem(SYNC_KEY, JSON.stringify(sync));
  else localStorage.removeItem(SYNC_KEY);
}

function setStatus(s) {
  syncStatus = s;
  if (s === 'ok') lastSyncAt = new Date();
  const [label, tone] = STATUS[s];
  statusBtn.textContent = label;
  statusBtn.style.setProperty('--tone', tone);
  if (dialog.open && sync) renderSyncDialog();
}

async function gh(path, { method = 'GET', body, token } = {}) {
  const res = await fetch('https://api.github.com' + path, {
    method,
    cache: 'no-store',
    headers: {
      'Accept': 'application/vnd.github+json',
      'Authorization': `Bearer ${token || sync.token}`,
      ...(body ? { 'Content-Type': 'application/json' } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const err = new Error(`GitHub ${res.status}`);
    err.status = res.status;
    throw err;
  }
  return res.json();
}

const serialize = () => JSON.stringify({ updatedAt: state.updatedAt, done: state.done, used: state.used }, null, 2);
let firstPull = true; // при первом обновлении из облака пересчитываем порядок карточек

function handleSyncError(err) {
  if (err.status === 401 || err.status === 403) { setStatus('auth'); return; }
  if (err.status === 404) { setStatus('missing'); return; }
  setStatus('offline');
  clearTimeout(retryTimer);
  retryTimer = setTimeout(pull, 30000);
}

function schedulePush() {
  if (!sync) return;
  setStatus('syncing');
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, 1500);
}

async function push() {
  clearTimeout(pushTimer);
  pushTimer = null;
  if (!sync || pushing) return;
  pushing = true;
  setStatus('syncing');
  const sentAt = state.updatedAt;
  let ok = false;
  try {
    await gh(`/gists/${sync.gistId}`, { method: 'PATCH', body: { files: { [GIST_FILE]: { content: serialize() } } } });
    ok = true;
    setStatus('ok');
  } catch (err) {
    handleSyncError(err);
  } finally {
    pushing = false;
    // Если пока отправляли, что-то поменялось — отправим ещё раз
    if (ok && state.updatedAt !== sentAt) schedulePush();
  }
}

async function pull() {
  if (!sync) return;
  clearTimeout(retryTimer);
  try {
    if (!pushing) setStatus('syncing');
    const gist = await gh(`/gists/${sync.gistId}`);
    const file = gist.files && gist.files[GIST_FILE];
    const remote = file ? JSON.parse(file.content) : null;
    const remoteAt = (remote && remote.updatedAt) || 0;

    if (remote && typeof remote.done === 'object' && remoteAt > state.updatedAt) {
      // В облаке версия новее — берём её
      state = { updatedAt: remoteAt, done: remote.done, used: remote.used || {} };
      saveState();
      if (firstPull) cardOrder = computeOrder();
      render();
      setStatus('ok');
    } else if (!remote || state.updatedAt > remoteAt) {
      // Локальная версия новее — отправляем
      await push();
    } else {
      setStatus('ok');
    }
    firstPull = false;
  } catch (err) {
    handleSyncError(err);
  }
}

async function connect(token) {
  // Проверяем токен и ищем уже существующий gist (например, созданный с другого устройства)
  const gists = await gh('/gists?per_page=100', { token });
  const found = gists.find(g => g.files && g.files[GIST_FILE]);
  let gistId;
  if (found) {
    gistId = found.id;
  } else {
    const created = await gh('/gists', {
      method: 'POST',
      token,
      body: { description: 'Йога-трекер: отметки', public: false, files: { [GIST_FILE]: { content: serialize() } } },
    });
    gistId = created.id;
  }
  sync = { token, gistId };
  saveSync();
  await pull();
}

// ===== Сетка: месяц на широком экране, неделя на узком =====
const gridEl = document.getElementById('grid');
const statsEl = document.getElementById('stats');
const titleEl = document.getElementById('period-title');
const nextBtn = document.getElementById('next-btn');
const wideQuery = matchMedia('(min-width: 1000px)');
let mode = wideQuery.matches ? 'month' : 'week';
let anchor = new Date(); // месяц: любой день месяца; неделя: последний день недели

wideQuery.addEventListener('change', () => {
  mode = wideQuery.matches ? 'month' : 'week';
  anchor = new Date();
  renderGrid();
});

function periodDays() {
  const days = [];
  if (mode === 'month') {
    const y = anchor.getFullYear(), m = anchor.getMonth();
    const n = new Date(y, m + 1, 0).getDate();
    for (let i = 1; i <= n; i++) days.push(new Date(y, m, i));
  } else {
    for (let i = 6; i >= 0; i--) {
      days.push(new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate() - i));
    }
  }
  return days;
}

function shiftPeriod(dir) {
  if (mode === 'month') {
    anchor = new Date(anchor.getFullYear(), anchor.getMonth() + dir, 1);
  } else {
    anchor = new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate() + 7 * dir);
    if (ymd(anchor) > todayStr()) anchor = new Date();
  }
  renderGrid();
}

function renderGrid() {
  const days = periodDays();
  const ds = days.map(ymd);
  const today = todayStr();
  const isWeekend = d => d.getDay() === 0 || d.getDay() === 6;

  if (mode === 'month') {
    const month = new Intl.DateTimeFormat('ru', { month: 'long' }).format(anchor);
    titleEl.textContent = `${capitalize(month)} ${anchor.getFullYear()}`;
  } else {
    const f = new Intl.DateTimeFormat('ru', { day: 'numeric', month: 'long' });
    titleEl.textContent = `${f.format(days[0])} – ${f.format(days[days.length - 1])}`;
  }
  nextBtn.disabled = ds[ds.length - 1] >= today;

  gridEl.className = `habit-grid ${mode}`;
  gridEl.style.setProperty('--days', days.length);

  let html = '<div></div>';
  days.forEach((d, i) => {
    html += `<div class="head ${isWeekend(d) ? 'weekend' : ''} ${ds[i] === today ? 'is-today' : ''}"><b>${d.getDate()}</b><span>${WEEKDAYS[d.getDay()]}</span></div>`;
  });

  SERIES.forEach(s => {
    html += `<div class="row-label"><span class="swatch" style="background:${s.color}"></span>${s.name}</div>`;
    const perDay = ds.map(date => doneOn(s, date));
    days.forEach((d, i) => {
      const items = perDay[i];
      const filled = items.length > 0;
      const joinL = filled && i > 0 && perDay[i - 1].length > 0;
      const joinR = filled && i < days.length - 1 && perDay[i + 1].length > 0;
      const last = items[items.length - 1];
      const label = filled ? (last.day === null ? '•' : last.day) : '';
      const future = ds[i] > today;
      html += `
        <button class="cell ${isWeekend(d) ? 'weekend' : ''} ${joinL ? 'join-l' : ''} ${joinR ? 'join-r' : ''}" style="--c:${s.color}"
          data-action="cell" data-series="${s.id}" data-date="${ds[i]}" ${future ? 'disabled' : ''}
          aria-label="${s.name}, ${ds[i]}${filled ? ', сделано' : ''}">
          <span class="dot ${filled ? 'filled' : ''} ${ds[i] === today ? 'today' : ''}">${label}</span>
        </button>`;
    });
  });

  html += '<div></div>';
  days.forEach((d, i) => {
    const n = SERIES.reduce((acc, s) => acc + doneOn(s, ds[i]).length, 0);
    html += `<div class="count ${isWeekend(d) ? 'weekend' : ''}">${n || ''}</div>`;
  });

  gridEl.innerHTML = html;

  // Статистика за показанный период
  const from = ds[0], to = ds[ds.length - 1];
  const inPeriod = [...LESSONS.values()].filter(l => {
    const d = state.done[l.id];
    return d && d >= from && d <= to;
  });
  const count = inPeriod.length;
  const minutes = Math.round(inPeriod.reduce((acc, l) => acc + durMin(l.dur), 0));
  const activeDays = new Set(inPeriod.map(l => state.done[l.id])).size;
  const top = SERIES
    .map(s => [s, inPeriod.filter(l => l.series === s).length])
    .sort((a, b) => b[1] - a[1])[0];

  statsEl.innerHTML = `
    <div class="stat"><div class="stat-value">${count}</div><div class="stat-label">${plural(count, ['практика', 'практики', 'практик'])}</div></div>
    <div class="stat"><div class="stat-value">${minutes}</div><div class="stat-label">${plural(minutes, ['минута', 'минуты', 'минут'])} на коврике</div></div>
    <div class="stat"><div class="stat-value">${activeDays}</div><div class="stat-label">${plural(activeDays, ['день', 'дня', 'дней'])} с практикой</div></div>
    <div class="stat"><div class="stat-value">${top[1] > 0 ? top[0].name : '—'}</div><div class="stat-label">чаще всего</div></div>`;
}

// ===== Общий рендер =====
function render() {
  document.getElementById('today').textContent =
    new Intl.DateTimeFormat('ru', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());
  renderCards();
  renderGrid();
}

// ===== Действия =====
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const { action } = el.dataset;

  if (action === 'done-next') {
    const s = SERIES_BY_ID[el.dataset.series];
    const next = nextOf(s);
    if (!next) return;
    const undo = setDone(next.id, todayStr());
    toast(`${s.name} · ${lessonLabel(next)} — отмечено`, undo);
  }

  if (action === 'toggle-lesson') {
    const l = LESSONS.get(el.dataset.id);
    if (isDone(l.id)) {
      const undo = setDone(l.id, undefined);
      toast(`Отметка снята: ${l.series.name} · ${lessonLabel(l)}`, undo);
    } else {
      const undo = setDone(l.id, todayStr());
      toast(`${l.series.name} · ${lessonLabel(l)} — отмечено`, undo);
    }
  }

  if (action === 'cell') {
    const s = SERIES_BY_ID[el.dataset.series];
    const date = el.dataset.date;
    const items = doneOn(s, date);
    if (items.length) {
      const last = items[items.length - 1];
      const undo = setDone(last.id, undefined);
      toast(`Отметка снята: ${s.name} · ${lessonLabel(last)}`, undo);
    } else {
      const next = nextOf(s);
      if (!next) { toast(`${s.name}: серия уже пройдена`); return; }
      const undo = setDone(next.id, date);
      toast(`${s.name} · ${lessonLabel(next)} — ${fmtShort(date)}`, undo);
    }
  }

  if (action === 'start') {
    // Нажатие «Начать» — тоже использование серии. Без перерисовки: страница уходит в YouTube
    state.used[el.dataset.series] = Date.now();
    state.updatedAt = Date.now();
    saveState();
    schedulePush();
  }

  if (action === 'prev') shiftPeriod(-1);
  if (action === 'next') shiftPeriod(1);

  if (action === 'sync-dialog') openSyncDialog();
  if (action === 'dialog-close') dialog.close();
  if (action === 'sync-connect') handleConnect(el);
  if (action === 'sync-now') pull();
  if (action === 'sync-disconnect') {
    if (!confirm('Отключить синхронизацию на этом устройстве? Данные в Gist останутся.')) return;
    sync = null;
    saveSync();
    clearTimeout(pushTimer);
    clearTimeout(retryTimer);
    setStatus('off');
    renderSyncDialog();
  }
});

// Ушли со страницы — сразу отправляем несохранённое; вернулись — подтягиваем свежее
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (pushTimer) push();
  } else {
    render();
    pull();
  }
});
window.addEventListener('online', pull);

// ===== Старт =====
cardOrder = computeOrder();
render();
setStatus(syncStatus);
if (sync) {
  pull();
} else if (!localStorage.getItem(PROMPT_KEY)) {
  localStorage.setItem(PROMPT_KEY, '1');
  openSyncDialog();
}
</script>
</body>
</html>
